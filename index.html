<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語学習アプリ</title>
    <style>
        /* スマートフォン向けのデザイン設定 */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 15px; background-color: #f0f4f8; color: #333; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; color: #2c3e50; margin-bottom: 20px; }
        .hidden { display: none !important; }
        select, input[type="text"] { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 8px; background: #3498db; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-sizing: border-box; }
        button:active { background: #2980b9; }
        
        .choice-btn { background: #ecf0f1; color: #2c3e50; border: 1px solid #bdc3c7; }
        .choice-btn:active { background: #d5dbdb; }
        .next-btn { background: #2ecc71; margin-top: 20px; }
        .next-btn:active { background: #27ae60; }
        
        .question-text { font-size: 24px; font-weight: bold; margin: 15px 0; color: #e74c3c; }
        .context-text { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; line-height: 1.4; }
        .hint { font-size: 14px; color: #d35400; font-weight: bold; margin-bottom: 15px; background: #fdf2e9; padding: 8px; border-radius: 6px; }

        /* 進捗・タイマー表示エリア */
        .info-bar { display: flex; justify-content: space-between; font-size: 14px; color: #7f8c8d; margin-bottom: 8px; font-weight: bold; }
        .progress-container { width: 100%; background: #e0e0e0; border-radius: 5px; height: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; background: #3498db; width: 0%; transition: width 0.3s; }
        
        /* フィードバック（正誤判定）エリア */
        .feedback { font-size: 24px; font-weight: bold; margin: 10px 0 20px; }
        .feedback.correct { color: #27ae60; }
        .feedback.incorrect { color: #e74c3c; }
        .feedback-details { font-size: 16px; margin-bottom: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 5px solid #bdc3c7; line-height: 1.6; }
        
        /* 結果画面のデザイン */
        .result-list { text-align: left; margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        .result-item { border-bottom: 1px solid #eee; padding: 12px 0; font-size: 14px; line-height: 1.5; }
        .correct-mark { color: #27ae60; font-weight: bold; }
        .incorrect-mark { color: #e74c3c; font-weight: bold; }
        .score-display { font-size: 22px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .time-display { font-size: 16px; color: #7f8c8d; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="setup-screen">
    <h1>英単語学習アプリ</h1>
    <p>出題形式を選択してください</p>
    <select id="mode">
        <option value="write">書き（入力：意味から英単語を入力）</option>
        <option value="write_easy">書き（簡単：意味から英単語を選択）</option>
        <option value="read">読み（英単語から意味を選択）</option>
        <option value="mix" selected>MIX（全形式ランダム）</option>
    </select>
    
    <p>出題数を選択してください</p>
    <select id="count">
        <option value="10">10問</option>
        <option value="25">25問</option>
        <option value="50">50問</option>
        <option value="100">100問</option>
    </select>
    
    <button onclick="startGame()">学習をスタート</button>
</div>

<div class="container hidden" id="quiz-screen">
    <!-- タイマーと進捗バー -->
    <div class="info-bar">
        <span id="progress-text">第 1 問 / 全 -- 問</span>
        <span id="timer-text">00:00</span>
    </div>
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- 問題表示エリア -->
    <div id="question-area"></div>

    <!-- フィードバック（都度の正誤判定）エリア -->
    <div id="feedback-area" class="hidden">
        <div id="feedback-title" class="feedback"></div>
        <div id="feedback-details" class="feedback-details"></div>
        <button class="next-btn" onclick="nextQuestion()">次の問題へ進む</button>
    </div>
</div>

<div class="container hidden" id="result-screen">
    <h1>学習結果</h1>
    <div class="score-display" id="score-display"></div>
    <div class="time-display" id="final-time"></div>
    <button onclick="location.reload()">トップに戻る（再挑戦）</button>
    <div class="result-list" id="result-list"></div>
</div>

<script>
    // 資料から抽出した英単語データ (原形として登録)
    const wordList = [
        { en: "conduct", ja: "実行する、実施する", context: "conduct research" },
        { en: "per", ja: "～につき、～あたり", context: "$10 per person" },
        { en: "representative", ja: "担当者、代表者", context: "talk to a representative" },
        { en: "proposal", ja: "提案", context: "a project proposal" },
        { en: "corporate", ja: "企業の、法人の", context: "a corporate event" },
        { en: "gallery", ja: "美術館、画廊", context: "visit a gallery" },
        { en: "encourage", ja: "奨励する、促す", context: "What are listeners encouraged to do?" },
        { en: "author", ja: "著者、作者 / (本を)書く", context: "He is a famous author." },
        { en: "committee", ja: "委員会", context: "the budget committee" },
        { en: "latest", ja: "最新の", context: "the latest news" },
        { en: "enclose", ja: "同封する、囲む", context: "Please fill out the enclosed form." },
        { en: "expand", ja: "拡大する、拡張する、進出する", context: "expand business" },
        { en: "editor", ja: "編集者", context: "a magazine editor" },
        { en: "fund", ja: "資金、基金 / 資金を提供する", context: "raise funds" },
        { en: "vehicle", ja: "乗物、車両", context: "A man is getting into a vehicle." },
        { en: "focus", ja: "～に集中させる、重点を置く / 焦点", context: "We focus on quality." },
        { en: "approve", ja: "承認する、賛成する", context: "The request has been approved." },
        { en: "sponsor", ja: "スポンサーになる、後援する / スポンサー", context: "sponsor an event" },
        { en: "previous", ja: "前の、以前の", context: "previous work experience" },
        { en: "reception", ja: "パーティー、受付", context: "attend a reception" },
        { en: "property", ja: "不動産、資産", context: "purchase a property" },
        { en: "campaign", ja: "キャンペーン", context: "start a marketing campaign" },
        { en: "replacement", ja: "後任、交換、交換品", context: "send a replacement" },
        { en: "organize", ja: "とりまとめる、組織化する、整理する", context: "organize a meeting" },
        { en: "competition", ja: "大会、競争、競争相手", context: "enter a competition" },
        { en: "employment", ja: "雇用", context: "an employment contract" },
        { en: "appreciate", ja: "感謝する、ありがたく思う", context: "I appreciate your support" },
        { en: "indicate", ja: "示す、示唆する", context: "He indicated that he was interested" },
        { en: "reference", ja: "照会先、照会状、参照", context: "provide a list of references" },
        { en: "resident", ja: "住民、住人", context: "talk to local residents" },
        { en: "individual", ja: "個人の、個別の", context: "individual products" },
        { en: "advance", ja: "先行した、事前の / 進歩、前進", context: "provide advance notice" },
        { en: "organization", ja: "団体、会社、組織(化)", context: "join an organization" },
        { en: "remind", ja: "再確認する、念押しする", context: "remind a patient about an appointment" },
        { en: "section", ja: "一部、コーナー、欄、章", context: "read the community news section" },
        { en: "senior", ja: "(役職などが)上級の、上位の", context: "He is a senior sales manager." },
        { en: "technical", ja: "技術的な", context: "ask for technical support" },
        { en: "estimate", ja: "見積もり / 見積もる", context: "give a cost estimate" },
        { en: "publication", ja: "出版物、出版", context: "announce the publication of a new magazine" },
        { en: "unfortunately", ja: "残念なことに、残念ながら", context: "Unfortunately, the tickets are sold out." },
        { en: "expense", ja: "費用、経費", context: "reduce expenses" },
        { en: "operation", ja: "業務、運営、操業、作動", context: "change the hours of operation" },
        { en: "exhibition", ja: "展示会、展示物、展示", context: "visit an exhibition" },
        { en: "operate", ja: "操作する、運営する", context: "operate a computer" },
        { en: "original", ja: "元の、最初の / オリジナル、原本", context: "50% off the original" },
        { en: "receipt", ja: "領収書、受取", context: "Tex has lost the receipt" },
        { en: "division", ja: "部門、配分、分担", context: "He is the division manager." },
        { en: "photography", ja: "写真撮影", context: "run a photography studio" },
        { en: "reschedule", ja: "スケジュール変更する", context: "reschedule an appointment with a doctor" },
        { en: "stock", ja: "在庫、株", context: "The product is out of stock." },
        { en: "association", ja: "協会、組合", context: "join an association" },
        { en: "concern", ja: "心配、懸念、関心事", context: "What concern does the speaker express?" },
        { en: "luggage", ja: "旅行かばん、手荷物", context: "Tex lost his luggage." },
        { en: "suggestion", ja: "提案、示唆", context: "ask for suggestions" },
        { en: "launch", ja: "開始、発売 / 開始する、発売する", context: "announce the launch of a new product" },
        { en: "procedure", ja: "手続き、手順", context: "safety procedures" },
        { en: "description", ja: "説明、記述、描写", context: "read a job description" },
        { en: "variety", ja: "種類", context: "We offer a wide variety of classes." },
        { en: "term", ja: "条件、期限、観点", context: "the terms of a contract" },
        { en: "distribute", ja: "配布する、流通させる", context: "A man is distributing some documents." },
        { en: "leading", ja: "首位の、トップの", context: "a leading accounting firm" },
        { en: "mainly", ja: "主に", context: "What is the talk mainly about?" },
        { en: "release", ja: "発売する、公表する / 発売", context: "release a new model" },
        { en: "response", ja: "返答、返事", context: "I need your response by Friday." },
        { en: "retire", ja: "退職する", context: "He will retire on March 30." },
        { en: "determine", ja: "決定する、判断する、決心する", context: "determine which way to go" },
        { en: "expert", ja: "専門家 / 専門的な", context: "She is a cooking expert." },
        { en: "journal", ja: "専門誌", context: "a journal article" },
        { en: "series", ja: "一連のモノ、シリーズ(モノ)", context: "watch a new television series" },
        { en: "requirement", ja: "要求、必要条件", context: "meet the requirements for a position" },
        { en: "assistance", ja: "支援、援助", context: "I appreciate your assistance." },
        { en: "council", ja: "議会", context: "The city council will meet tomorrow." },
        { en: "electronic", ja: "電子の、電子版の、オンラインの", context: "Please turn off any electronic equipment." },
        { en: "recommendation", ja: "推薦", context: "write a letter of recommendation" },
        { en: "attract", ja: "引き付ける、呼び込む、誘致する", context: "attract new readers" },
        { en: "quarter", ja: "四半期", context: "sales in the first quarter" },
        { en: "promotion", ja: "昇進、販売促進、促進", context: "receive a promotion" },
        { en: "concerned", ja: "心配して", context: "What is the man concerned about?" },
        { en: "extend", ja: "延長する", context: "extend business hours" },
        { en: "trail", ja: "(田舎の)小道、田舎道", context: "a hiking trail" },
        { en: "avoid", ja: "避ける", context: "avoid rush hour traffic" },
        { en: "celebration", ja: "お祝い、祝典", context: "a holiday celebration" },
        { en: "impress", ja: "感心させる、好印象を与える", context: "We were impressed with your work." },
        { en: "seek", ja: "探し求める", context: "seek volunteers" },
        { en: "coworker", ja: "同僚", context: "They are my coworkers." },
        { en: "extension", ja: "内線、延長", context: "Call me at extension 600." },
        { en: "postpone", ja: "延長する", context: "The meeting has been postponed." },
        { en: "region", ja: "地域", context: "travel throughout the region" },
        { en: "range", ja: "範囲 / 範囲にわたる", context: "offer a broad range of services" },
        { en: "convention", ja: "会議", context: "speak at a medical convention" },
        { en: "solution", ja: "解決策、溶液", context: "suggest a solution" },
        { en: "according to", ja: "～によると、～に従って", context: "according to Mr. Kato" },
        { en: "affect", ja: "影響する", context: "affect the schedule" },
        { en: "commercial", ja: "商業(用)の、商業的な / CM", context: "for commercial purposes" },
        { en: "convenient", ja: "便利な、都合の良い", context: "convenient location" },
        { en: "exchange", ja: "交換する / 交換", context: "exchange a ticket" },
        { en: "artwork", ja: "芸術作品", context: "buy an artwork by Picasso" },
        { en: "agreement", ja: "契約(書)、同意(書)、合意", context: "sign an agreement" },
        { en: "government", ja: "政府", context: "meet a government official" },
        { en: "major", ja: "主要な、大きな、重大な", context: "a major reason" }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let results = [];
    let selectedMode = 'mix';
    let currentResult = null; // その問題の判定結果を一時保存

    // タイマー用変数
    let startTime;
    let timerInterval;

    function startGame() {
        selectedMode = document.getElementById('mode').value;
        let count = parseInt(document.getElementById('count').value);

        let shuffled = [...wordList].sort(() => Math.random() - 0.5);
        currentQuestions = shuffled.slice(0, Math.min(count, wordList.length));

        currentIndex = 0;
        results = [];
        
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        // タイマースタート
        startTime = new Date();
        timerInterval = setInterval(updateTimer, 1000);

        showQuestion();
    }

    function updateTimer() {
        let now = new Date();
        let diff = Math.floor((now - startTime) / 1000);
        let minutes = Math.floor(diff / 60);
        let seconds = diff % 60;
        document.getElementById('timer-text').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function updateProgress() {
        document.getElementById('progress-text').innerText = `第 ${currentIndex + 1} 問 / 全 ${currentQuestions.length} 問`;
        let percent = (currentIndex / currentQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    function showQuestion() {
        if (currentIndex >= currentQuestions.length) {
            finishQuiz();
            return;
        }

        updateProgress();

        // 表示エリアの切り替え
        document.getElementById('question-area').classList.remove('hidden');
        document.getElementById('feedback-area').classList.add('hidden');

        let q = currentQuestions[currentIndex];
        let qMode = selectedMode;
        
        // MIXモードの場合は、書き(入力), 書き(簡単), 読み の中からランダムで出題
        if (qMode === 'mix') {
            let rand = Math.random();
            if (rand < 0.33) {
                qMode = 'write';
            } else if (rand < 0.66) {
                qMode = 'write_easy';
            } else {
                qMode = 'read';
            }
        }

        let container = document.getElementById('question-area');
        
        // 簡易的な文脈内単語の伏せ字化処理
        let contextRegex = new RegExp(q.en + "(d|ed|s|es|ing)?", "i");
        let maskedContext = q.context.replace(contextRegex, '______');

        if (qMode === 'write') {
            // 書き（テキスト入力）
            container.innerHTML = `
                <p>次の意味を持つ英単語（原形）を入力してください</p>
                <div class="question-text">${q.ja}</div>
                <div class="context-text">(${maskedContext})</div>
                <div class="hint">💡 ヒント：頭文字は「${q.en.charAt(0)}」 （全${q.en.length}文字）</div>
                <input type="text" id="write-answer" placeholder="英単語を入力" autocomplete="off" autocorrect="off" autocapitalize="off">
                <button onclick="checkWriteAnswer('${q.en}', '${q.ja}')">解答する</button>
            `;
            setTimeout(() => document.getElementById('write-answer').focus(), 100);
            
        } else if (qMode === 'write_easy') {
            // 書き（簡単：英単語の4択）
            let choices = [q.en];
            let wrongChoices = wordList.filter(w => w.en !== q.en).sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.en);
            choices = choices.concat(wrongChoices).sort(() => Math.random() - 0.5);

            let choicesHtml = choices.map(choice => 
                `<button class="choice-btn" onclick="checkWriteEasyAnswer('${choice}', '${q.en}', '${q.ja}')">${choice}</button>`
            ).join('');

            container.innerHTML = `
                <p>次の意味を持つ英単語を選択してください</p>
                <div class="question-text">${q.ja}</div>
                <div class="context-text">(${maskedContext})</div>
                ${choicesHtml}
            `;
            
        } else {
            // 読み（意味の4択）
            let choices = [q.ja];
            let wrongChoices = wordList.filter(w => w.ja !== q.ja).sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.ja);
            choices = choices.concat(wrongChoices).sort(() => Math.random() - 0.5);

            let choicesHtml = choices.map(choice => 
                `<button class="choice-btn" onclick="checkReadAnswer('${choice}', '${q.ja}', '${q.en}')">${choice}</button>`
            ).join('');

            container.innerHTML = `
                <p>次の英単語の意味を選択してください</p>
                <div class="question-text">${q.en}</div>
                <div class="context-text">(${q.context})</div>
                ${choicesHtml}
            `;
        }
    }

    function checkWriteAnswer(correctEn, ja) {
        let input = document.getElementById('write-answer').value.trim().toLowerCase();
        let isCorrect = (input === correctEn.toLowerCase());
        currentResult = { type: '書き', question: ja, correct: correctEn, userAnswer: input, isCorrect: isCorrect };
        showFeedback();
    }

    function checkWriteEasyAnswer(userChoice, correctEn, ja) {
        let isCorrect = (userChoice === correctEn);
        currentResult = { type: '書き(簡単)', question: ja, correct: correctEn, userAnswer: userChoice, isCorrect: isCorrect };
        showFeedback();
    }

    function checkReadAnswer(userChoice, correctJa, en) {
        let isCorrect = (userChoice === correctJa);
        currentResult = { type: '読み', question: en, correct: correctJa, userAnswer: userChoice, isCorrect: isCorrect };
        showFeedback();
    }

    function showFeedback() {
        document.getElementById('question-area').classList.add('hidden');
        let feedbackArea = document.getElementById('feedback-area');
        feedbackArea.classList.remove('hidden');

        let title = document.getElementById('feedback-title');
        let details = document.getElementById('feedback-details');

        if (currentResult.isCorrect) {
            title.innerText = "◯ 正解！";
            title.className = "feedback correct";
        } else {
            title.innerText = "✕ 不正解...";
            title.className = "feedback incorrect";
        }

        if (currentResult.type.includes('書き')) {
            // 書き(入力)、書き(簡単) の場合
            details.innerHTML = `
                <div><strong>意味:</strong> ${currentResult.question}</div>
                <div style="margin-top:10px;"><strong>あなたの解答:</strong> ${currentResult.userAnswer || '(未入力)'}</div>
                ${!currentResult.isCorrect ? `<div style="margin-top:10px; color:#27ae60;"><strong>正しい英単語:</strong> ${currentResult.correct}</div>` : ''}
            `;
        } else {
            // 読み の場合
            details.innerHTML = `
                <div><strong>英単語:</strong> ${currentResult.question}</div>
                <div style="margin-top:10px;"><strong>あなたの解答:</strong> ${currentResult.userAnswer}</div>
                ${!currentResult.isCorrect ? `<div style="margin-top:10px; color:#27ae60;"><strong>正しい意味:</strong> ${currentResult.correct}</div>` : ''}
            `;
        }
    }

    function nextQuestion() {
        results.push(currentResult);
        currentIndex++;
        showQuestion();
    }

    function finishQuiz() {
        clearInterval(timerInterval); // タイマー停止
        
        // プログレスバーを100%にする
        document.getElementById('progress-text').innerText = `全 ${currentQuestions.length} 問 終了！`;
        document.getElementById('progress-bar').style.width = `100%`;

        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        let correctCount = results.filter(r => r.isCorrect).length;
        let accuracy = Math.round((correctCount / results.length) * 100);

        document.getElementById('score-display').innerText = `正答率: ${accuracy}% (${correctCount} / ${results.length}問)`;
        document.getElementById('final-time').innerText = `クリアタイム: ${document.getElementById('timer-text').innerText}`;

        let resultHtml = results.map((r, index) => {
            let mark = r.isCorrect ? '<span class="correct-mark">◯ 正解</span>' : '<span class="incorrect-mark">✕ 不正解</span>';
            return `
                <div class="result-item">
                    <div><strong>Q${index + 1}. [${r.type}]</strong> ${r.question}</div>
                    <div>${mark}</div>
                    <div>あなたの解答: ${r.userAnswer || '(未入力)'}</div>
                    ${!r.isCorrect ? `<div class="correct-mark">正しい解答: ${r.correct}</div>` : ''}
                </div>
            `;
        }).join('');

        document.getElementById('result-list').innerHTML = resultHtml;
    }
</script>
</body>
</html>
